# Publica la landing en GitHub Pages en cada push a main.
# Solo se despliega lo que usa index.html; docs, herramientas y fotos originales quedan fuera.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar CSS minificado
        run: node tools/build-css.mjs

      - name: Ensamblar el sitio
        run: |
          mkdir -p _site/css
          cp index.html robots.txt _site/
          cp css/site.min.css _site/css/
          cp -r js assets data _site/
          rm -f _site/assets/brand/logo-rueda-valores.png   # original sin optimizar (1.3 MB), no se usa en la página
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
