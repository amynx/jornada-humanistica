<!doctype html>
<!-- Plantilla de la imagen para redes (1200×630). Se abre en un navegador a 1200×630 y se guarda como assets/og.jpg -->
<html lang="es-CO">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--papel); color: var(--tinta); }
  .og { position: relative; width: 1200px; height: 630px; }
  .txt { position: absolute; left: 64px; top: 58px; width: 470px; height: 514px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-stretch: 66%; font-size: 55px; line-height: .98; word-spacing: .06em; }
  .lema { font-family: var(--f-texto); font-style: italic; font-weight: 500; font-size: 32px; line-height: 1.15; color: var(--azul); margin: 0 0 18px; }
  .facts { margin: 0; padding: 0; list-style: none; font-family: var(--f-display); font-stretch: 100%; font-weight: 600; font-size: 21px; line-height: 1.45; }
  .num { position: absolute; right: 0; top: 58px; width: 688px; height: 452px; }
  .num svg { position: absolute; left: 0; top: 0; width: calc(62 / 152 * 100%); height: 100%; fill: var(--azul); }
  .win { position: absolute; top: 0; height: 100%; width: calc(22 / 152 * 100%); overflow: hidden; }
  .win img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ribbon { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(90deg, var(--v-naranja) 0 16.667%, var(--v-amarillo) 0 33.333%, var(--v-cielo) 0 50%, var(--v-amarillo) 0 66.667%, var(--v-verde) 0 83.333%, var(--v-magenta) 0); }
</style>
</head>
<body>
<div class="og">
  <div class="txt">
    <h1>Jornada Humanística, Social y Cultural</h1>
    <div>
      <p class="lema">Compite, conecta, transforma.</p>
      <ul class="facts"><li>Sábado 7 de noviembre de 2026</li><li>7:00 a. m. a 12:00 m.</li><li>Centro de Investigaciones Santa Lucía</li></ul>
    </div>
  </div>
  <div class="num">
    <svg viewBox="0 0 62 100"><polygon points="0,0 22,0 31,47 40,0 62,0 43,100 19,100"/></svg>
    <div class="win" style="left:calc(70 / 152 * 100%)"><img src="../assets/img/hero-1-560.jpg" alt=""></div>
    <div class="win" style="left:calc(100 / 152 * 100%)"><img src="../assets/img/hero-2-560.jpg" alt=""></div>
    <div class="win" style="left:calc(130 / 152 * 100%)"><img src="../assets/img/hero-3-560.jpg" alt=""></div>
  </div>
  <div class="ribbon"></div>
</div>
</body>
</html>
